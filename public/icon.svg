<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#4ecdc4"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#accent)" stroke-width="8"/>

  <!-- Headphone shape -->
  <path d="M 128 280
           Q 128 180 256 160
           Q 384 180 384 280"
        fill="none"
        stroke="url(#accent)"
        stroke-width="24"
        stroke-linecap="round"/>

  <!-- Left ear cup -->
  <rect x="100" y="260" width="56" height="100" rx="12" fill="url(#accent)"/>

  <!-- Right ear cup -->
  <rect x="356" y="260" width="56" height="100" rx="12" fill="url(#accent)"/>

  <!-- Sound waves left -->
  <path d="M 180 290 Q 200 310 180 330" fill="none" stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 200 280 Q 230 310 200 340" fill="none" stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Sound waves right -->
  <path d="M 332 290 Q 312 310 332 330" fill="none" stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 312 280 Q 282 310 312 340" fill="none" stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Microphone in center -->
  <ellipse cx="256" cy="380" rx="30" ry="45" fill="#e94560"/>
  <rect x="246" y="420" width="20" height="30" fill="#e94560"/>
  <rect x="230" y="445" width="52" height="8" rx="4" fill="#e94560"/>
</svg>
